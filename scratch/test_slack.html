<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #111; color: white; }
  .icon { width: 128px; height: 128px; border-radius: 28px; margin: 10px; }
  .darken { filter: saturate(0.85) brightness(0.55); }
  .smart-invert { filter: invert(1) hue-rotate(180deg) brightness(1.2) saturate(1.2); }
</style>
</head>
<body>
  <h2>Slack Original</h2>
  <img class="icon" src="../apps/scalable/slack.svg">
  
  <h2>Slack Darken</h2>
  <img class="icon darken" src="../apps/scalable/slack.svg">
  
  <h2>Slack Smart Invert</h2>
  <img class="icon smart-invert" src="../apps/scalable/slack.svg">
</body>
</html>
