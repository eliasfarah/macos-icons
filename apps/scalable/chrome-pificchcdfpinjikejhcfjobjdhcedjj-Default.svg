<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.7" flood-color="#34405c" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.52"/>
    </filter>

    <filter id="star-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.25" flood-color="#6c63d9" flood-opacity="0.24"/>
    </filter>

    <linearGradient id="light-glass" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="54%" stop-color="#f8faff"/>
      <stop offset="100%" stop-color="#e9edf8"/>
    </linearGradient>

    <radialGradient id="blue-glow" cx="20%" cy="12%" r="88%">
      <stop offset="0%" stop-color="#8ab4f8" stop-opacity="0.34"/>
      <stop offset="46%" stop-color="#8ab4f8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8ab4f8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violet-glow" cx="84%" cy="90%" r="72%">
      <stop offset="0%" stop-color="#c58af9" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c58af9" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#c58af9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gemini-star" x1="4%" y1="2%" x2="94%" y2="96%">
      <stop offset="0%" stop-color="#0b57d0"/>
      <stop offset="31%" stop-color="#4285f4"/>
      <stop offset="66%" stop-color="#9b72cb"/>
      <stop offset="100%" stop-color="#d965ef"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#78859d" stop-opacity="0.36"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#light-glass)"/>
  </g>

  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#blue-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#violet-glow)"/>
    <path d="M4 4H60V24C44 19 22 18 4 23Z" fill="#ffffff" opacity="0.24"/>
  </g>

  <path
    d="M32 12C32 23.0457 23.0457 32 12 32C23.0457 32 32 40.9543 32 52C32 40.9543 40.9543 32 52 32C40.9543 32 32 23.0457 32 12Z"
    fill="url(#gemini-star)"
    filter="url(#star-shadow)"
  />

  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
