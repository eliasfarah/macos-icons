<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.7" flood-color="#334052" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.38"/>
    </filter>
    <filter id="switch-shadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#344055" flood-opacity="0.24"/>
    </filter>
    <filter id="knob-shadow" x="-70%" y="-70%" width="240%" height="260%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#174c83" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="0.35" stdDeviation="0.35" flood-color="#ffffff" flood-opacity="0.92"/>
    </filter>
    <linearGradient id="tile" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#fbfbfc"/>
      <stop offset="100%" stop-color="#edf0f4"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="23%" cy="3%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8692a2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="switch-on" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#25c9ff"/>
      <stop offset="48%" stop-color="#129cf4"/>
      <stop offset="100%" stop-color="#087ee5"/>
    </linearGradient>
    <linearGradient id="switch-off" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#e3e6ea"/>
      <stop offset="54%" stop-color="#d2d7dd"/>
      <stop offset="100%" stop-color="#bec4cc"/>
    </linearGradient>
    <linearGradient id="knob" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dce3ea"/>
    </linearGradient>
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#808a98" stop-opacity="0.34"/>
    </linearGradient>
    <clipPath id="squircle-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#glass-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#squircle-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-glow)"/>
    <path d="M4 4H44C38 14 27 20 4 22Z" fill="#ffffff" opacity="0.72"/>
    <path d="M4 51C22 55 44 52 60 43V60H4Z" fill="#8d96a4" opacity="0.05"/>

    <g filter="url(#switch-shadow)">
      <rect x="10" y="13" width="44" height="16" rx="8" fill="url(#switch-on)"/>
      <rect x="10.7" y="13.7" width="42.6" height="14.6" rx="7.3"
            fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="0.7"/>
      <path d="M15 15.1H37" stroke="#ffffff" stroke-width="1.1"
            stroke-linecap="round" opacity="0.18"/>
      <circle cx="45.5" cy="21" r="5.4" fill="url(#knob)" filter="url(#knob-shadow)"/>
      <ellipse cx="44.4" cy="19.2" rx="2.6" ry="1.8" fill="#ffffff" opacity="0.72"/>
    </g>

    <g filter="url(#switch-shadow)">
      <rect x="10" y="35" width="44" height="16" rx="8" fill="url(#switch-off)"/>
      <rect x="10.7" y="35.7" width="42.6" height="14.6" rx="7.3"
            fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="0.7"/>
      <path d="M16 37.1H47" stroke="#ffffff" stroke-width="1"
            stroke-linecap="round" opacity="0.46"/>
      <circle cx="18.5" cy="43" r="5.4" fill="url(#knob)" filter="url(#knob-shadow)"/>
      <circle cx="18.5" cy="43" r="2.55" fill="#c4cbd3"/>
      <circle cx="18" cy="42.4" r="1.45" fill="#dfe4e9"/>
    </g>
  </g>

  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5"
        fill="none" stroke="url(#inner-bevel)" stroke-width="1"/>
</svg>
