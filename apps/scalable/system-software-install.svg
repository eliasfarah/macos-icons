<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.7" flood-color="#26335a" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.34"/>
    </filter>
    <filter id="cube-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.1" stdDeviation="2" flood-color="#30225c" flood-opacity="0.34"/>
    </filter>
    <filter id="badge-shadow" x="-45%" y="-45%" width="190%" height="195%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#17234c" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="tile" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f2f3ff"/>
      <stop offset="100%" stop-color="#d8e2f2"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="24%" cy="4%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8b9fc8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cube-top" x1="12%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#c690ff"/>
      <stop offset="100%" stop-color="#6c56e7"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65c8ff"/>
      <stop offset="100%" stop-color="#2874e7"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b6dff"/>
      <stop offset="100%" stop-color="#c44ed1"/>
    </linearGradient>
    <linearGradient id="plus" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#8df281"/>
      <stop offset="100%" stop-color="#21b95e"/>
    </linearGradient>
    <linearGradient id="minus" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff9a88"/>
      <stop offset="100%" stop-color="#ec4b61"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#66758e" stop-opacity="0.38"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-glow)"/>
    <path d="M4 4H44C38 14 27 20 4 22Z" fill="#ffffff" opacity="0.64"/>
    <path d="M4 49C22 54 43 51 60 41V60H4Z" fill="#7788aa" opacity="0.08"/>

    <g filter="url(#cube-shadow)" stroke="#ffffff" stroke-opacity="0.34" stroke-width="0.8" stroke-linejoin="round">
      <path d="M32 12L50 22L32 32L14 22Z" fill="url(#cube-top)"/>
      <path d="M14 22L32 32V52L14 42Z" fill="url(#cube-left)"/>
      <path d="M50 22L32 32V52L50 42Z" fill="url(#cube-right)"/>
      <path d="M25.5 15.6L43.5 25.6L38 28.7L20 18.7Z" fill="#ffffff" fill-opacity="0.30" stroke="none"/>
      <path d="M27.4 34.3V43.9L21.6 40.7V31.1Z" fill="#ffffff" fill-opacity="0.84" stroke="none"/>
      <path d="M35.7 34L45 28.8V32.6L35.7 37.8Z" fill="#ffffff" fill-opacity="0.24" stroke="none"/>
    </g>

    <g filter="url(#badge-shadow)">
      <circle cx="48" cy="17.5" r="8.6" fill="url(#plus)"/>
      <circle cx="48" cy="17.5" r="7.85" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="0.8"/>
      <path d="M48 13.4V21.6M43.9 17.5H52.1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g filter="url(#badge-shadow)">
      <circle cx="16.5" cy="47" r="7.7" fill="url(#minus)"/>
      <circle cx="16.5" cy="47" r="6.95" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="0.8"/>
      <path d="M12.7 47H20.3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
