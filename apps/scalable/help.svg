        <circle cx="32" cy="31.5" r="17.4" fill="url(#red)"/>
        <g stroke="url(#white-band)" stroke-width="8.2" stroke-linecap="butt">
          <path d="M39 24.5L48.5 15"/>
          <path d="M39 38.5L48.5 48"/>
          <path d="M25 38.5L15.5 48"/>
          <path d="M25 24.5L15.5 15"/>
        </g>
        <ellipse cx="27" cy="22.5" rx="12" ry="8" fill="#ffffff" opacity="0.13" transform="rotate(-26 27 22.5)"/>
        <path d="M15.5 39C24 46 39 47 49 36" fill="none" stroke="#650719" stroke-opacity="0.30" stroke-width="3"/>
      </g>
      <circle cx="32" cy="31.5" r="8.55" fill="url(#hole)"/>
      <circle cx="32" cy="31.5" r="8.75" fill="none" stroke="#76091f" stroke-opacity="0.66" stroke-width="1"/>
      <path d="M32 10.8V15M52.7 31.5H48.5M32 52.2V48M11.3 31.5H15.5" stroke="#b78b49" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M18.8 20A16.8 16.8 0 0 1 34 14.3" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.2" stroke-linecap="round"/>
    </g>
