<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.7" flood-color="#063d68" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
    <filter id="buoy-shadow" x="-45%" y="-45%" width="190%" height="195%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#052d4e" flood-opacity="0.54"/>
    </filter>
    <linearGradient id="tile" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#83e7f4"/>
      <stop offset="48%" stop-color="#32b8dc"/>
      <stop offset="100%" stop-color="#0b71ad"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="23%" cy="3%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hole" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#5bd0e4"/>
      <stop offset="100%" stop-color="#075781"/>
    </radialGradient>
    <radialGradient id="red" cx="32%" cy="20%" r="82%">
      <stop offset="0%" stop-color="#ff9d85"/>
      <stop offset="34%" stop-color="#f54d46"/>
      <stop offset="70%" stop-color="#d51e32"/>
      <stop offset="100%" stop-color="#8f091f"/>
    </radialGradient>
    <linearGradient id="white-band" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f5f0e7"/>
      <stop offset="100%" stop-color="#c9c0b4"/>
    </linearGradient>
    <linearGradient id="rope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="48%" stop-color="#d5b56f"/>
      <stop offset="100%" stop-color="#94692c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
