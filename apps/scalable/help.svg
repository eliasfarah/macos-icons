      <circle cx="32" cy="31.5" r="20.7" fill="none" stroke="#8b642d" stroke-width="2.4" opacity="0.58"/>
      <circle cx="32" cy="31.5" r="20.7" fill="none" stroke="url(#rope)" stroke-width="1.55" stroke-dasharray="1.25 1.05"/>
      <circle cx="32" cy="31.5" r="18.3" fill="#750a20" opacity="0.52"/>
