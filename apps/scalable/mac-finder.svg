<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Drop Shadow -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- 3D Bevel/Glass Highlights -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Left Cyan Gradient (Official macOS Finder Cyan/Sky Blue) -->
    <linearGradient id="finder-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Right Blue Gradient (Official macOS Finder Deep Blue) -->
    <linearGradient id="finder-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Background Base with Shadow -->
  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <!-- Right Half Base (Deep Royal Blue) -->
      <rect width="56" height="56" x="4" y="4" fill="url(#finder-right)" />
      
      <!-- Left Half Base (Bright Cyan/Blue) -->
      <path d="M 4 4 H 32 C 32 4 26 22 33 38 C 36 46 32 60 32 60 H 4 Z" fill="url(#finder-left)" />
      
      <!-- Center Nose/Dividing Line -->
      <path d="M 32 4 C 32 4 26 22 33 38 C 36 46 32 60 32 60" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
      
      <!-- Left Eye (Dark Navy) -->
      <ellipse cx="21" cy="24" rx="3.2" ry="3.5" fill="#0f172a" />
      
      <!-- Right Eye (White) -->
      <ellipse cx="43" cy="24" rx="3.2" ry="3.5" fill="#ffffff" />

      <!-- Smile Arc -->
      <path d="M 17 37 C 23 47 41 47 47 37" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Glass Bevel Overlay -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>