<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Drop Shadow -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- 3D Bevel/Glass Highlights -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- macOS Finder Left Half (Bright Cyan Gradient) -->
    <linearGradient id="finder-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4bc4f7" />
      <stop offset="50%" stop-color="#2bb1f5" />
      <stop offset="100%" stop-color="#1d9bf0" />
    </linearGradient>

    <!-- macOS Finder Right Half (Deep Royal Blue Gradient) -->
    <linearGradient id="finder-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1977f2" />
      <stop offset="50%" stop-color="#1260e6" />
      <stop offset="100%" stop-color="#0945c7" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Background Base with Shadow -->
  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <!-- Right Half Base (Deep Royal Blue) -->
      <rect width="56" height="56" x="4" y="4" fill="url(#finder-right)" />
      
      <!-- Left Half Base (Cyan Blue with Nose Curve) -->
      <path d="M 4 4 H 32 C 32 4 25 18 27 27 C 29 34 36 37 32 60 H 4 Z" fill="url(#finder-left)" />
      
      <!-- Center Nose/Dividing Line (Dark Charcoal Stroke) -->
      <path d="M 32 4 C 32 4 25 18 27 27 C 29 34 36 37 32 60" fill="none" stroke="#081c38" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      
      <!-- Left Eye (Dark Navy) -->
      <ellipse cx="20.5" cy="24.5" rx="3.2" ry="3.5" fill="#081c38" />
      
      <!-- Right Eye (Pure White) -->
      <ellipse cx="43.5" cy="24.5" rx="3.2" ry="3.5" fill="#ffffff" />

      <!-- Smile Arc (Dark Navy) -->
      <path d="M 16.5 36.5 C 22.5 46.5 41.5 46.5 47.5 36.5" fill="none" stroke="#081c38" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Glass Bevel Overlay -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>