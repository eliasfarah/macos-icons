<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Drop Shadow -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Smile Drop Shadow -->
    <filter id="smile-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 3D Bevel/Glass Highlights -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Left Half Cyan/Blue Gradient -->
    <linearGradient id="finder-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bdff" />
      <stop offset="45%" stop-color="#1ea1f7" />
      <stop offset="100%" stop-color="#1271e6" />
    </linearGradient>

    <!-- Right Half White/Light Gray Gradient -->
    <linearGradient id="finder-white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Background Base with Shadow -->
  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <!-- Right Half (White / Light Silver Gray) -->
      <rect width="56" height="56" x="4" y="4" fill="url(#finder-white-grad)" />
      
      <!-- Left Half (Cyan / Sky Blue) with Face Profile Curve -->
      <path d="M 4 4 H 30.5 L 27.5 28.5 H 31.5 V 36 C 31.5 36 30 48 32.5 60 H 4 Z" fill="url(#finder-cyan-grad)" />
      
      <!-- Face Profile Contour / Nose Line -->
      <path d="M 30.5 4 L 27.5 28.5 H 31.5 V 36 C 31.5 36 30 48 32.5 60" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" opacity="0.8" />
      
      <!-- Left Eye (Vertical Pill Capsule) -->
      <rect x="20" y="19" width="4" height="9.5" rx="2" ry="2" fill="#1e293b" />
      
      <!-- Right Eye (Vertical Pill Capsule) -->
      <rect x="40" y="19" width="4" height="9.5" rx="2" ry="2" fill="#1e293b" />

      <!-- Smile Arc with Soft Shadow -->
      <g filter="url(#smile-shadow)">
        <path d="M 19 35.5 C 24 44.5 40 44.5 45 35.5" fill="none" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Glass Bevel Overlay -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>