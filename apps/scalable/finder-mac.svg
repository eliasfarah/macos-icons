<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Drop Shadow -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- 3D Bevel/Glass Highlights -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Finder Left Side Gradient (Light Cyan) -->
    <linearGradient id="finder-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Finder Right Side Gradient (Deep Blue) -->
    <linearGradient id="finder-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Squircle Clip -->
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Background Base with Shadow -->
  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <!-- Left Split (Cyan) -->
      <rect width="28" height="56" x="4" y="4" fill="url(#finder-left-grad)" />
      <!-- Right Split (Blue) -->
      <rect width="28" height="56" x="32" y="4" fill="url(#finder-right-grad)" />
      
      <!-- Finder Two-Tone Nose/Split Curve -->
      <path d="M 32 4 C 29 20, 35 36, 32 60" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round"/>
      
      <!-- Finder Left Eye -->
      <circle cx="21" cy="24" r="3" fill="#0f172a" />
      <!-- Finder Right Eye -->
      <circle cx="43" cy="24" r="3" fill="#ffffff" />

      <!-- Finder Iconic Smile -->
      <path d="M 18 36 C 24 46, 40 46, 46 36" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Glass Bevel Overlay -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>