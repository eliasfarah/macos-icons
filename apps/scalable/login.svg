<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.6" flood-color="#102c59" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.28"/>
    </filter>
    <filter id="panel-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.7" flood-color="#07316f" flood-opacity="0.28"/>
    </filter>
    <filter id="badge-shadow" x="-45%" y="-45%" width="190%" height="195%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#06245a" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="tile" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#8cdbff"/>
      <stop offset="47%" stop-color="#4a9df4"/>
      <stop offset="100%" stop-color="#2361d8"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="24%" cy="5%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#d9eaff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#256fc5"/>
      <stop offset="100%" stop-color="#123d89"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8e7f8"/>
    </linearGradient>
    <linearGradient id="badge" x1="18%" y1="0%" x2="78%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#e7f1fd"/>
      <stop offset="100%" stop-color="#b9cce4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0b3173" stop-opacity="0.34"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-glow)"/>
    <path d="M4 4H42C37 17 28 24 4 26Z" fill="#ffffff" opacity="0.10"/>
    <path d="M4 46C21 53 41 50 60 40V60H4Z" fill="#0b3f9b" opacity="0.16"/>

    <g filter="url(#panel-shadow)">
      <rect x="10.5" y="12.5" width="43" height="39" rx="9" fill="url(#frame)"/>
      <rect x="12.5" y="14.5" width="39" height="35" rx="7.2" fill="url(#screen)"/>
    </g>
    <rect x="13.2" y="15.2" width="37.6" height="33.6" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.23" stroke-width="0.8"/>

    <circle cx="29.5" cy="26.5" r="6.1" fill="url(#avatar)"/>
    <path d="M18.2 39.1C19.4 33.6 23.6 30.6 29.5 30.6C35.4 30.6 39.6 33.6 40.8 39.1C41.1 40.4 40.1 41.5 38.8 41.5H20.2C18.9 41.5 17.9 40.4 18.2 39.1Z" fill="url(#avatar)"/>
    <rect x="19.5" y="43.8" width="20" height="3.2" rx="1.6" fill="#071f4e" opacity="0.32"/>
    <circle cx="24.8" cy="45.4" r="0.9" fill="#ffffff"/>
    <circle cx="29.5" cy="45.4" r="0.9" fill="#ffffff"/>
    <circle cx="34.2" cy="45.4" r="0.9" fill="#ffffff"/>

    <g filter="url(#badge-shadow)">
      <circle cx="47.5" cy="46.5" r="10" fill="url(#badge)"/>
      <circle cx="47.5" cy="46.5" r="9.25" fill="none" stroke="#ffffff" stroke-opacity="0.82" stroke-width="0.8"/>
    </g>
    <g fill="none" stroke="#245ca8" stroke-width="2.25" stroke-linecap="round">
      <circle cx="47.5" cy="46.5" r="4.4"/>
      <path d="M47.5 37.8V40M47.5 53V55.2M38.8 46.5H41M54 46.5H56.2M41.35 40.35L42.9 41.9M52.1 51.1L53.65 52.65M41.35 52.65L42.9 51.1M52.1 41.9L53.65 40.35"/>
    </g>
    <circle cx="47.5" cy="46.5" r="1.75" fill="#245ca8"/>
  </g>

  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
