  <g filter="url(#store-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#store-bg)"/>
  </g>
  <g clip-path="url(#store-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#store-sheen)"/>
    <rect x="4" y="35" width="56" height="25" fill="url(#store-floor)"/>

    <g filter="url(#store-glyph-shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g>
        <path d="M15.9 38.2H48.1" stroke="url(#store-bar-edge)" stroke-width="5.3"/>
        <path d="M15.9 38.2H48.1" stroke="url(#store-bar-horizontal)" stroke-width="4.5"/>
        <path d="M16.2 37.75H47.8" stroke="#ffffff" stroke-width="0.45" opacity="0.54"/>
      </g>
      <g>
        <path d="M29.1 17.8L45.1 45.6" stroke="url(#store-bar-edge)" stroke-width="5.3"/>
        <path d="M29.1 17.8L45.1 45.6" stroke="url(#store-bar-down)" stroke-width="4.5"/>
        <path d="M28.82 18.15L44.82 45.25" stroke="#ffffff" stroke-width="0.44" opacity="0.44"/>
      </g>
      <g>
        <path d="M35 17.8L18.9 45.6" stroke="url(#store-bar-edge)" stroke-width="5.3"/>
        <path d="M35 17.8L18.9 45.6" stroke="url(#store-bar-up)" stroke-width="4.5"/>
        <path d="M34.7 17.65L18.6 45.3" stroke="#ffffff" stroke-width="0.48" opacity="0.60"/>
      </g>
    </g>
