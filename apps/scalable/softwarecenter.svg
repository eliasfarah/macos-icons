<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="store-shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#0751b8" flood-opacity="0.34"/>
    </filter>
    <filter id="store-glyph-shadow" x="-30%" y="-25%" width="160%" height="165%">
      <feDropShadow dx="0" dy="1.05" stdDeviation="0.8" flood-color="#034aa3" flood-opacity="0.62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="0.32" flood-color="#ffffff" flood-opacity="0.62"/>
    </filter>
    <linearGradient id="store-bg" gradientUnits="userSpaceOnUse" x1="32" y1="4" x2="32" y2="60">
      <stop offset="0%" stop-color="#08a6f6"/>
      <stop offset="43%" stop-color="#078af0"/>
      <stop offset="100%" stop-color="#2364e8"/>
    </linearGradient>
    <radialGradient id="store-sheen" cx="24%" cy="2%" r="92%" fx="24%" fy="2%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="store-floor" gradientUnits="userSpaceOnUse" x1="32" y1="38" x2="32" y2="60">
      <stop offset="0%" stop-color="#164ed3" stop-opacity="0"/>
      <stop offset="100%" stop-color="#164ed3" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="store-rim" gradientUnits="userSpaceOnUse" x1="32" y1="4" x2="32" y2="60">
      <stop offset="0%" stop-color="#73efff" stop-opacity="0.90"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a45c7" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="store-bar-edge" gradientUnits="userSpaceOnUse" x1="32" y1="15" x2="32" y2="49">
      <stop offset="0%" stop-color="#f8feff" stop-opacity="0.92"/>
      <stop offset="46%" stop-color="#7fa7c3" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#5a8db8" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="store-bar-horizontal" gradientUnits="userSpaceOnUse" x1="32" y1="35.4" x2="32" y2="41.1">
      <stop offset="0%" stop-color="#fafdff"/>
      <stop offset="42%" stop-color="#e5f0f7"/>
      <stop offset="100%" stop-color="#cbdceb"/>
    </linearGradient>
    <linearGradient id="store-bar-down" gradientUnits="userSpaceOnUse" x1="28.9" y1="17.4" x2="46.2" y2="46.5">
      <stop offset="0%" stop-color="#d6eaf3"/>
      <stop offset="30%" stop-color="#edf8fc"/>
      <stop offset="52%" stop-color="#c7dce8"/>
      <stop offset="72%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#d7e3f0"/>
    </linearGradient>
    <linearGradient id="store-bar-up" gradientUnits="userSpaceOnUse" x1="17.8" y1="46.6" x2="35.1" y2="17.1">
      <stop offset="0%" stop-color="#d8e4f1"/>
      <stop offset="34%" stop-color="#cbddea"/>
      <stop offset="62%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcecf4"/>
    </linearGradient>
    <clipPath id="store-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
