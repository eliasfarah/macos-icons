<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.7" flood-color="#123b63" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.65" flood-color="#ffffff" flood-opacity="0.44" />
    </filter>
    <filter id="orb-shadow" x="-35%" y="-35%" width="170%" height="185%">
      <feDropShadow dx="0" dy="2.1" stdDeviation="2" flood-color="#063765" flood-opacity="0.36" />
      <feDropShadow dx="0" dy="0" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.48" />
    </filter>
    <filter id="cursor-shadow" x="-40%" y="-35%" width="190%" height="200%">
      <feDropShadow dx="0.8" dy="2.1" stdDeviation="1.55" flood-color="#07355c" flood-opacity="0.48" />
    </filter>
    <filter id="node-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.05" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="tile-bg" gradientUnits="userSpaceOnUse" x1="15" y1="5" x2="49" y2="60">
      <stop offset="0%" stop-color="#eafaff" />
      <stop offset="46%" stop-color="#c8efff" />
      <stop offset="100%" stop-color="#77bde9" />
    </linearGradient>
    <radialGradient id="tile-sheen" cx="20%" cy="2%" r="92%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72" />
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="tile-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="56%" stop-color="#1a6daf" stop-opacity="0" />
      <stop offset="100%" stop-color="#1a6daf" stop-opacity="0.17" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#1b5f93" stop-opacity="0.30" />
    </linearGradient>
    <radialGradient id="orb" cx="31%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#55dcf8" />
      <stop offset="40%" stop-color="#1aa9e8" />
      <stop offset="74%" stop-color="#147ddd" />
      <stop offset="100%" stop-color="#1553b7" />
    </radialGradient>
    <linearGradient id="orb-rim" x1="18%" y1="5%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="39%" stop-color="#abf1ff" />
      <stop offset="100%" stop-color="#2c79c7" />
    </linearGradient>
    <linearGradient id="cursor" gradientUnits="userSpaceOnUse" x1="34" y1="15" x2="48" y2="42">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fbfdff" />
      <stop offset="100%" stop-color="#d2e2ee" />
    </linearGradient>
    <linearGradient id="cursor-edge" gradientUnits="userSpaceOnUse" x1="35" y1="15" x2="48" y2="43">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#5d8fac" />
    </linearGradient>

    <clipPath id="tile-clip"><rect x="4" y="4" width="56" height="56" rx="14" /></clipPath>
    <clipPath id="orb-clip"><circle cx="29.5" cy="33" r="21.15" /></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile-bg)" />
  </g>

  <g clip-path="url(#tile-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-sheen)" />
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-floor)" />

    <g filter="url(#orb-shadow)">
      <circle cx="29.5" cy="33" r="22" fill="#225783" opacity="0.42" />
      <circle cx="29.5" cy="33" r="21.45" fill="url(#orb-rim)" />
      <circle cx="29.5" cy="33" r="20.65" fill="url(#orb)" />
    </g>

    <g clip-path="url(#orb-clip)" fill="none" stroke="#e7fbff"
       stroke-width="0.72" opacity="0.34">
      <ellipse cx="29.5" cy="33" rx="9.2" ry="20.8" />
      <ellipse cx="29.5" cy="33" rx="16.4" ry="20.8" />
      <path d="M8.8 33 H50.2" />
      <path d="M10.7 24.3 C20.8 27.7 38.2 27.7 48.3 24.3" />
      <path d="M10.7 41.7 C20.8 38.3 38.2 38.3 48.3 41.7" />
    </g>

    <path d="M11.3 21.4 C18.6 14.1 33.9 10.3 44.7 18.3"
          fill="none" stroke="#ffffff" stroke-width="1.25"
          stroke-linecap="round" opacity="0.39" />
    <path d="M13.6 41.7 C18.5 47.8 26.2 50.15 33.3 48.9
             C39.55 47.8 44.65 44.2 47.75 38.7"
          fill="none" stroke="#d5fbff" stroke-width="1.42"
          stroke-linecap="round" stroke-dasharray="1.1 3.15" opacity="0.96" />
    <g fill="#ffffff" stroke="#76ddf7" stroke-width="0.55"
       filter="url(#node-glow)">
      <circle cx="13.7" cy="41.7" r="1.7" />
      <circle cx="31.8" cy="49.1" r="1.35" />
      <circle cx="47.7" cy="38.7" r="1.7" />
    </g>

    <g filter="url(#cursor-shadow)">
      <path d="M33.6 14.35 L52.05 28.85 L43.15 30.55
               L49.25 40.55 L44.2 43.6 L38.1 33.45 L32.15 40.2 Z"
            fill="#1d425c" stroke="#17364d" stroke-width="2.35"
            stroke-linejoin="round" />
      <path d="M33.6 14.35 L52.05 28.85 L43.15 30.55
               L49.25 40.55 L44.2 43.6 L38.1 33.45 L32.15 40.2 Z"
            fill="url(#cursor)" stroke="url(#cursor-edge)"
            stroke-width="0.65" stroke-linejoin="round" />
      <path d="M35.15 17.35 L48.95 28.15 L41.15 29.65"
            fill="none" stroke="#ffffff" stroke-width="0.74"
            stroke-linecap="round" opacity="0.92" />
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75"
        fill="none" stroke="#174e7a" stroke-opacity="0.24" stroke-width="0.5" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25"
        fill="none" stroke="url(#rim)" stroke-width="0.78" />
</svg>
