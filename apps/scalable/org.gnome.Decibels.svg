      <path d="M16.2 35V31.5C16.2 21.5 22.7 16.5 32 16.5C41.3 16.5 47.8 21.5 47.8 31.5V35" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
