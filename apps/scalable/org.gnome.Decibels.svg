    </filter>
    <filter id="player-shadow" x="-38%" y="-38%" width="176%" height="185%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#0b2454" flood-opacity="0.46"/>
    </filter>
    <linearGradient id="tile" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#82ecff"/>
      <stop offset="48%" stop-color="#4fa6f6"/>
      <stop offset="100%" stop-color="#5c5be8"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="23%" cy="3%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="35%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#304f82"/>
      <stop offset="58%" stop-color="#172b50"/>
      <stop offset="100%" stop-color="#0a1430"/>
    </radialGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="32" y1="17" x2="32" y2="49">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#dce9f5"/>
      <stop offset="100%" stop-color="#829bb2"/>
