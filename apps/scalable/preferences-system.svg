<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="settings-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gear-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <rect width="56" height="56" x="4" y="4" fill="url(#settings-bg)" />
      
      <!-- Central Gear wheel -->
      <g transform="translate(32, 32)">
        <!-- 8 Gear Teeth -->
        <rect x="-3.5" y="-19" width="7" height="38" rx="2" fill="url(#gear-grad)" />
        <rect x="-3.5" y="-19" width="7" height="38" rx="2" fill="url(#gear-grad)" transform="rotate(45)" />
        <rect x="-3.5" y="-19" width="7" height="38" rx="2" fill="url(#gear-grad)" transform="rotate(90)" />
        <rect x="-3.5" y="-19" width="7" height="38" rx="2" fill="url(#gear-grad)" transform="rotate(135)" />
        
        <!-- Gear Outer Circle -->
        <circle cx="0" cy="0" r="14" fill="url(#gear-grad)" />
        
        <!-- Gear Center Hole -->
        <circle cx="0" cy="0" r="6" fill="#1e293b" />
      </g>
    </g>
  </g>

  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>