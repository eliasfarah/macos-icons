<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="yellow-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <rect width="56" height="56" x="4" y="4" fill="url(#paper-bg)" />
      
      <!-- Top Yellow Header -->
      <rect width="56" height="12" x="4" y="4" fill="url(#yellow-header)" />
      
      <!-- Notebook Lined Paper Lines -->
      <line x1="12" y1="22" x2="52" y2="22" stroke="#eab308" stroke-width="1" opacity="0.5" />
      <line x1="12" y1="29" x2="52" y2="29" stroke="#eab308" stroke-width="1" opacity="0.5" />
      <line x1="12" y1="36" x2="52" y2="36" stroke="#eab308" stroke-width="1" opacity="0.5" />
      <line x1="12" y1="43" x2="52" y2="43" stroke="#eab308" stroke-width="1" opacity="0.5" />
      <line x1="12" y1="50" x2="52" y2="50" stroke="#eab308" stroke-width="1" opacity="0.5" />
      
      <!-- Pencil Diagonal -->
      <g transform="translate(18, 12) rotate(-35)">
        <rect x="0" y="0" width="6" height="30" rx="1" fill="#f97316" />
        <path d="M 0 30 L 3 36 L 6 30 Z" fill="#fde047" />
        <path d="M 2 34 L 3 36 L 4 34 Z" fill="#1e293b" />
        <rect x="0" y="-3" width="6" height="3" fill="#cbd5e1" />
        <rect x="0" y="-7" width="6" height="4" rx="1" fill="#f43f5e" />
      </g>
    </g>
  </g>

  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>