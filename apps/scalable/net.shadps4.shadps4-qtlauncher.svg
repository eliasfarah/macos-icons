<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#07113b" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="0.65" stdDeviation="0.65" flood-color="#15349c" flood-opacity="0.30" />
    </filter>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="1.35" stdDeviation="1.05" flood-color="#070a49" flood-opacity="0.62" />
    </filter>
    <filter id="symbol-glow" x="-55%" y="-55%" width="210%" height="220%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.65" flood-color="#06105a" flood-opacity="0.56" />
      <feDropShadow dx="0" dy="0" stdDeviation="0.7" flood-color="#42d8ff" flood-opacity="0.22" />
    </filter>

    <linearGradient id="card" gradientUnits="userSpaceOnUse" x1="16" y1="5" x2="48" y2="60">
      <stop offset="0%" stop-color="#7895ff" />
      <stop offset="42%" stop-color="#4566ed" />
      <stop offset="73%" stop-color="#2634bc" />
      <stop offset="100%" stop-color="#14106c" />
    </linearGradient>
    <radialGradient id="card-bloom" cx="24%" cy="7%" r="88%">
      <stop offset="0%" stop-color="#e7f7ff" stop-opacity="0.44" />
      <stop offset="45%" stop-color="#91c8ff" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#1c36bd" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="52%" stop-color="#0b124b" stop-opacity="0" />
      <stop offset="100%" stop-color="#07062c" stop-opacity="0.42" />
    </linearGradient>
    <linearGradient id="symbol" gradientUnits="userSpaceOnUse" x1="13" y1="10" x2="52" y2="57">
      <stop offset="0%" stop-color="#72eeff" />
      <stop offset="45%" stop-color="#21c8ff" />
      <stop offset="100%" stop-color="#1398ff" />
    </linearGradient>
    <linearGradient id="four" gradientUnits="userSpaceOnUse" x1="20" y1="15" x2="39" y2="50">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f7fbff" />
      <stop offset="100%" stop-color="#c8dcff" />
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82" />
      <stop offset="35%" stop-color="#c8efff" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#071354" stop-opacity="0.42" />
    </linearGradient>
    <clipPath id="tile-clip">
      <rect x="4" y="4" width="56" height="56" rx="14" />
    </clipPath>
  </defs>

  <g filter="url(#card-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#card)" />
  </g>

  <g clip-path="url(#tile-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#card-bloom)" />
    <path d="M4 21 C18 14.8 44 13.2 60 18.5 V27 C42 22.3 19 23.2 4 29 Z"
          fill="#d9f7ff" opacity="0.075" />
    <path d="M4 35 C20 30.8 44 30.4 60 34.2 V41.2 C43 38 21 38.8 4 43.2 Z"
          fill="#0c1b75" opacity="0.12" />
    <rect x="4" y="4" width="56" height="56" fill="url(#card-floor)" />

    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#symbol-glow)">
      <g stroke="#08145b" stroke-opacity="0.46" stroke-width="4.5" transform="translate(0 0.75)">
        <circle cx="17.3" cy="18.7" r="6.35" />
        <path d="M46.8 10.6 L55.6 21.1 L43.2 24.2 Z" />
        <path d="M7.05 44.3 L18.4 48.25 L14.5 59.6 L3.15 55.65 Z" />
        <path d="M45.5 39.5 L54.4 51 M54.15 39.6 L45.25 50.9" />
      </g>
      <g stroke="url(#symbol)" stroke-width="2.8">
        <circle cx="17.3" cy="18.7" r="6.35" />
        <path d="M46.8 10.6 L55.6 21.1 L43.2 24.2 Z" />
        <path d="M7.05 44.3 L18.4 48.25 L14.5 59.6 L3.15 55.65 Z" />
        <path d="M45.5 39.5 L54.4 51 M54.15 39.6 L45.25 50.9" />
      </g>
      <g stroke="#d9fbff" stroke-opacity="0.34" stroke-width="0.65" transform="translate(-0.28 -0.32)">
        <circle cx="17.3" cy="18.7" r="6.35" />
        <path d="M46.8 10.6 L55.6 21.1 L43.2 24.2 Z" />
        <path d="M7.05 44.3 L18.4 48.25 L14.5 59.6 L3.15 55.65 Z" />
        <path d="M45.5 39.5 L54.4 51 M54.15 39.6 L45.25 50.9" />
      </g>
    </g>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark-shadow)">
      <g stroke="#09104e" stroke-opacity="0.48" stroke-width="8.2" transform="translate(0 0.8)">
        <path d="M34.35 16.2 L16.55 38.7 H43.1" />
        <path d="M34.35 16.2 V49.2" />
      </g>
      <g stroke="url(#four)" stroke-width="6.25">
        <path d="M34.35 16.2 L16.55 38.7 H43.1" />
        <path d="M34.35 16.2 V49.2" />
      </g>
      <g stroke="#ffffff" stroke-opacity="0.44" stroke-width="0.85" transform="translate(-0.42 -0.45)">
        <path d="M34.35 16.2 L16.55 38.7 H43.1" />
        <path d="M34.35 16.2 V49.2" />
      </g>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75"
        fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="0.5" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25"
        fill="none" stroke="url(#rim)" stroke-width="0.8" />
</svg>
