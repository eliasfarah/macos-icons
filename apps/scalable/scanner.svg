<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="155%">
      <feDropShadow dx="0" dy="2.6" stdDeviation="2.7" flood-color="#173954" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.30"/>
    </filter>
    <filter id="paper-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.7" flood-color="#183751" flood-opacity="0.27"/>
    </filter>
    <filter id="device-shadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#10283c" flood-opacity="0.42"/>
    </filter>
    <filter id="beam-glow" x="-20%" y="-250%" width="140%" height="600%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="tile" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f8feff"/>
      <stop offset="50%" stop-color="#d9f3fb"/>
      <stop offset="100%" stop-color="#acd6e9"/>
    </linearGradient>
    <radialGradient id="tile-glow" cx="24%" cy="3%" r="88%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6aa9c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6eef5"/>
    </linearGradient>
    <linearGradient id="paper-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dce8f1"/>
      <stop offset="100%" stop-color="#b9cbd9"/>
    </linearGradient>
    <linearGradient id="deck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d9e6"/>
      <stop offset="100%" stop-color="#6f879b"/>
    </linearGradient>
    <linearGradient id="body" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3f6683"/>
      <stop offset="52%" stop-color="#27455f"/>
      <stop offset="100%" stop-color="#14283a"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24445e"/>
      <stop offset="100%" stop-color="#0e2030"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#385d73" stop-opacity="0.38"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#tile-glow)"/>
    <path d="M4 4H43C38 15 27 21 4 23Z" fill="#ffffff" opacity="0.64"/>
    <path d="M4 49C21 55 42 52 60 41V60H4Z" fill="#4f8ca8" opacity="0.09"/>

    <g filter="url(#paper-shadow)">
      <path d="M18 9.5H39.5L46 16V42H18Z" fill="url(#paper)"/>
      <path d="M39.5 9.5V16H46Z" fill="url(#paper-fold)"/>
      <path d="M22.5 17H35.5" stroke="#4a8bc1" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M22.5 22H40.5M22.5 25.5H38" stroke="#9fb0bd" stroke-width="1.15" stroke-linecap="round"/>
      <rect x="22.5" y="29" width="9.5" height="7.5" rx="1.2" fill="#79c4e9"/>
      <path d="M23.5 35.3L26.3 32.8L28 34.2L29.6 32.5L31.2 35.3Z" fill="#276f9b"/>
      <circle cx="29.4" cy="30.9" r="0.9" fill="#fff4a5"/>
      <path d="M35 29.7H41M35 33H40M35 36.3H39" stroke="#a5b4bf" stroke-width="1.05" stroke-linecap="round"/>
    </g>

    <g filter="url(#device-shadow)">
      <path d="M13 31.5H51L56 39.5H8Z" fill="url(#deck)" stroke="#ffffff" stroke-opacity="0.46" stroke-width="0.8" stroke-linejoin="round"/>
      <rect x="8" y="37.5" width="48" height="17" rx="5.5" fill="url(#body)"/>
      <rect x="11.5" y="40.5" width="41" height="10.5" rx="3.4" fill="url(#front)"/>
      <rect x="14" y="38" width="36" height="3" rx="1.5" fill="#091723"/>
      <path d="M12.5 39H51.5" stroke="#8ad9f3" stroke-opacity="0.32" stroke-width="0.8"/>
      <circle cx="49" cy="47" r="1.8" fill="#68ef88"/>
      <circle cx="49" cy="47" r="0.75" fill="#e9ffe9"/>
      <path d="M15 50H37" stroke="#5c7890" stroke-width="1" stroke-linecap="round"/>
    </g>

    <g filter="url(#beam-glow)">
      <path d="M12 34.5H52" stroke="#42e7ff" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M14 33.9H50" stroke="#e5fdff" stroke-width="0.65" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
