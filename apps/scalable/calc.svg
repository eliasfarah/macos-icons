<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="calc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e37" />
      <stop offset="100%" stop-color="#12151b" />
    </linearGradient>
    <linearGradient id="orange-btn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb733" />
      <stop offset="100%" stop-color="#ff9500" />
    </linearGradient>
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g filter="url(#glass-shadow)">
    <g clip-path="url(#squircle-clip)">
      <rect width="56" height="56" x="4" y="4" fill="url(#calc-bg)" />
      
      <!-- Display Bar -->
      <rect x="10" y="10" width="44" height="11" rx="3" fill="#0b0d10" opacity="0.8" />
      <text x="50" y="18.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="8" fill="#ffffff" text-anchor="end">1,234</text>
      
      <!-- Keypad Grid -->
      <!-- Row 1 -->
      <rect x="10" y="24" width="9" height="7" rx="2" fill="#525866" />
      <rect x="21" y="24" width="9" height="7" rx="2" fill="#525866" />
      <rect x="32" y="24" width="9" height="7" rx="2" fill="#525866" />
      <rect x="43" y="24" width="11" height="7" rx="2" fill="url(#orange-btn)" />
      
      <!-- Row 2 -->
      <rect x="10" y="33" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="21" y="33" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="32" y="33" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="43" y="33" width="11" height="7" rx="2" fill="url(#orange-btn)" />

      <!-- Row 3 -->
      <rect x="10" y="42" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="21" y="42" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="32" y="42" width="9" height="7" rx="2" fill="#3a3f4d" />
      <rect x="43" y="42" width="11" height="7" rx="2" fill="url(#orange-btn)" />

      <!-- Row 4 -->
      <rect x="10" y="51" width="20" height="6" rx="2" fill="#3a3f4d" />
      <rect x="32" y="51" width="9" height="6" rx="2" fill="#3a3f4d" />
      <rect x="43" y="51" width="11" height="6" rx="2" fill="url(#orange-btn)" />

      <!-- Key Labels -->
      <text x="48.5" y="29.5" font-family="sans-serif" font-weight="700" font-size="6" fill="#ffffff" text-anchor="middle">÷</text>
      <text x="48.5" y="38.5" font-family="sans-serif" font-weight="700" font-size="6" fill="#ffffff" text-anchor="middle">×</text>
      <text x="48.5" y="47.5" font-family="sans-serif" font-weight="700" font-size="6" fill="#ffffff" text-anchor="middle">−</text>
      <text x="48.5" y="56" font-family="sans-serif" font-weight="700" font-size="5" fill="#ffffff" text-anchor="middle">=</text>
    </g>
  </g>

  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>