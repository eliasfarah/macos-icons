<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="album-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <filter id="record-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.7" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
    <linearGradient id="d-bg" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#3b2038"/>
      <stop offset="48%" stop-color="#21121f"/>
      <stop offset="100%" stop-color="#0c080c"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#e852b6" stop-opacity="0.16"/>
      <stop offset="58%" stop-color="#e852b6" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#e852b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-sheen" cx="22%" cy="4%" r="82%" fx="22%" fy="4%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#ff77b7"/>
      <stop offset="48%" stop-color="#d84fc0"/>
      <stop offset="100%" stop-color="#6c49cc"/>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff3a8"/>
      <stop offset="100%" stop-color="#ff9a5a"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="34%" cy="27%" r="76%">
      <stop offset="0%" stop-color="#414060"/>
      <stop offset="42%" stop-color="#1c1a31"/>
      <stop offset="100%" stop-color="#050409"/>
    </radialGradient>
    <radialGradient id="label" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#65e6ff"/>
      <stop offset="52%" stop-color="#6f72ff"/>
      <stop offset="100%" stop-color="#df4dbe"/>
    </radialGradient>
    <linearGradient id="d-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <clipPath id="d-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
    <clipPath id="cover-clip">
      <rect x="12" y="12" width="35" height="39" rx="6"/>
    </clipPath>
  </defs>

  <g filter="url(#d-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#d-bg)"/>
  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 49C22 54 43 51 60 41V60H4Z" fill="#000000" opacity="0.22"/>

    <g filter="url(#album-shadow)">
      <rect x="9.5" y="15" width="35" height="39" rx="6" fill="#603e68" opacity="0.78" transform="rotate(-5 27 34.5)"/>
      <rect x="12" y="12" width="35" height="39" rx="6" fill="url(#sleeve)"/>
      <g clip-path="url(#cover-clip)">
        <circle cx="29.5" cy="27" r="9.5" fill="url(#sun)"/>
        <path d="M9 37C18 29 25 31 33 37C41 43 47 38 52 33V53H9Z" fill="#5d3daf" opacity="0.78"/>
        <path d="M10 42C20 36 30 41 38 43C45 45 49 42 52 40V53H10Z" fill="#332975" opacity="0.66"/>
        <path d="M15 17H29" stroke="#fff7df" stroke-width="2.1" stroke-linecap="round" opacity="0.86"/>
        <path d="M15 21H24" stroke="#fff7df" stroke-width="1.1" stroke-linecap="round" opacity="0.54"/>
      </g>
      <rect x="12.6" y="12.6" width="33.8" height="37.8" rx="5.4" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="0.8"/>
    </g>

    <g filter="url(#record-shadow)">
      <circle cx="42.5" cy="39" r="14.2" fill="url(#vinyl)"/>
      <circle cx="42.5" cy="39" r="11.7" fill="none" stroke="#8c879e" stroke-opacity="0.28" stroke-width="0.65"/>
      <circle cx="42.5" cy="39" r="9.5" fill="none" stroke="#8c879e" stroke-opacity="0.22" stroke-width="0.55"/>
      <circle cx="42.5" cy="39" r="7.3" fill="none" stroke="#8c879e" stroke-opacity="0.20" stroke-width="0.5"/>
      <circle cx="42.5" cy="39" r="5.2" fill="url(#label)"/>
      <circle cx="42.5" cy="39" r="1.15" fill="#f8f4ff"/>
      <path d="M34.5 30.2A12 12 0 0 1 44 27" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.20"/>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
</svg>
