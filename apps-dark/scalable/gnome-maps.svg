      <circle cx="32" cy="32" r="11" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2" />
      <path d="M 32 24.5 L 38 39.5 L 32 36 L 26 39.5 Z" fill="#ffffff" />
