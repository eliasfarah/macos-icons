      <stop offset="0%" stop-color="#4aa3ff" />
      <stop offset="100%" stop-color="#0a63d2" />
    </linearGradient>
  </defs>

  <g filter="url(#d-shadow)">
    <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="url(#d-bg)" />
