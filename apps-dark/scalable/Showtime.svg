  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 49C22 54 43 51 60 41V60H4Z" fill="#000000" opacity="0.22"/>

    <g filter="url(#screen-shadow)">
      <rect x="9.5" y="13.5" width="45" height="36" rx="8" fill="url(#frame)"/>
      <rect x="11.5" y="15.5" width="41" height="32" rx="6.4" fill="url(#screen)"/>
    </g>
    <g clip-path="url(#screen-clip)">
      <rect x="11.5" y="15.5" width="41" height="32" fill="url(#screen-glow)"/>
      <path d="M10 16H39C35 25 26 30 10 31Z" fill="#ffffff" opacity="0.11"/>
      <path d="M11 39C25 43 39 41 53 34V48H11Z" fill="#0c0a36" opacity="0.20"/>
    </g>
    <rect x="12.2" y="16.2" width="39.6" height="30.6" rx="5.7" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.8"/>

    <g filter="url(#play-shadow)">
      <circle cx="32" cy="29.5" r="9.4" fill="url(#play-disc)" stroke="#ffffff" stroke-opacity="0.36" stroke-width="0.9"/>
      <path d="M29.3 24.3L38.8 29.5L29.3 34.7Z" fill="#ffffff"/>
      <path d="M30.2 25.4V33.6" stroke="#ffffff" stroke-opacity="0.46" stroke-width="0.65" stroke-linecap="round"/>
    </g>

    <rect x="17" y="42.3" width="30" height="2.2" rx="1.1" fill="#ffffff" opacity="0.20"/>
    <rect x="17" y="42.3" width="17.2" height="2.2" rx="1.1" fill="url(#progress)"/>
    <circle cx="34.2" cy="43.4" r="1.65" fill="#fff4f8" stroke="#e95b9d" stroke-width="0.65"/>
    <path d="M28 50H36L38.5 53H25.5Z" fill="url(#stand)"/>
    <rect x="22.5" y="52.3" width="19" height="2.3" rx="1.15" fill="url(#stand)"/>
    <path d="M23.5 52.8H40.5" stroke="#ffffff" stroke-opacity="0.20" stroke-width="0.6" stroke-linecap="round"/>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
