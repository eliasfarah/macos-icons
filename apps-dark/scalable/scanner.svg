<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="paper-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.7" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <filter id="device-shadow" x="-30%" y="-35%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="beam-glow" x="-20%" y="-250%" width="140%" height="600%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="d-bg" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#1d3543"/>
      <stop offset="48%" stop-color="#101d27"/>
      <stop offset="100%" stop-color="#070b0f"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#35d8ff" stop-opacity="0.15"/>
      <stop offset="58%" stop-color="#35d8ff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#35d8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-sheen" cx="22%" cy="4%" r="82%" fx="22%" fy="4%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce5ec"/>
    </linearGradient>
    <linearGradient id="paper-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7e2ea"/>
      <stop offset="100%" stop-color="#9fb3c1"/>
    </linearGradient>
    <linearGradient id="deck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90a7b8"/>
      <stop offset="100%" stop-color="#465d6e"/>
    </linearGradient>
    <linearGradient id="body" x1="8%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#365b74"/>
      <stop offset="52%" stop-color="#203d52"/>
      <stop offset="100%" stop-color="#0d1c28"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3548"/>
      <stop offset="100%" stop-color="#08141d"/>
    </linearGradient>
    <linearGradient id="d-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <clipPath id="d-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#d-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#d-bg)"/>
  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 49C21 55 42 52 60 41V60H4Z" fill="#000000" opacity="0.20"/>

    <g filter="url(#paper-shadow)">
      <path d="M18 9.5H39.5L46 16V42H18Z" fill="url(#paper)"/>
      <path d="M39.5 9.5V16H46Z" fill="url(#paper-fold)"/>
      <path d="M22.5 17H35.5" stroke="#4a8bc1" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M22.5 22H40.5M22.5 25.5H38" stroke="#8fa2b0" stroke-width="1.15" stroke-linecap="round"/>
      <rect x="22.5" y="29" width="9.5" height="7.5" rx="1.2" fill="#64b9df"/>
      <path d="M23.5 35.3L26.3 32.8L28 34.2L29.6 32.5L31.2 35.3Z" fill="#205f8b"/>
      <circle cx="29.4" cy="30.9" r="0.9" fill="#fff0a0"/>
      <path d="M35 29.7H41M35 33H40M35 36.3H39" stroke="#99aab6" stroke-width="1.05" stroke-linecap="round"/>
    </g>

    <g filter="url(#device-shadow)">
      <path d="M13 31.5H51L56 39.5H8Z" fill="url(#deck)" stroke="#ffffff" stroke-opacity="0.27" stroke-width="0.8" stroke-linejoin="round"/>
      <rect x="8" y="37.5" width="48" height="17" rx="5.5" fill="url(#body)"/>
      <rect x="11.5" y="40.5" width="41" height="10.5" rx="3.4" fill="url(#front)"/>
      <rect x="14" y="38" width="36" height="3" rx="1.5" fill="#050b10"/>
      <path d="M12.5 39H51.5" stroke="#8ad9f3" stroke-opacity="0.26" stroke-width="0.8"/>
      <circle cx="49" cy="47" r="1.8" fill="#68ef88"/>
      <circle cx="49" cy="47" r="0.75" fill="#e9ffe9"/>
      <path d="M15 50H37" stroke="#47677d" stroke-width="1" stroke-linecap="round"/>
    </g>

    <g filter="url(#beam-glow)">
      <path d="M12 34.5H52" stroke="#42e7ff" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M14 33.9H50" stroke="#e5fdff" stroke-width="0.65" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
</svg>
