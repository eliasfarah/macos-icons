      <stop offset="55%" stop-color="#ff9f45" stop-opacity="0.0595" />
      <stop offset="100%" stop-color="#ff9f45" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="t-roof" x1="0%" y1="0%" x2="0%" y2="100%">
