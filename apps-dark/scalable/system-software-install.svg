<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="cube-shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="2.1" stdDeviation="2" flood-color="#000000" flood-opacity="0.56"/>
    </filter>
    <filter id="badge-shadow" x="-45%" y="-45%" width="190%" height="195%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.64"/>
    </filter>
    <linearGradient id="d-bg" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#302447"/>
      <stop offset="48%" stop-color="#191326"/>
      <stop offset="100%" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#8a63ff" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#8a63ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8a63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-sheen" cx="22%" cy="4%" r="82%" fx="22%" fy="4%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cube-top" x1="12%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#ca94ff"/>
      <stop offset="100%" stop-color="#7059ee"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68cdff"/>
      <stop offset="100%" stop-color="#2775eb"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9072ff"/>
      <stop offset="100%" stop-color="#cf53dc"/>
    </linearGradient>
    <linearGradient id="plus" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#96f48a"/>
      <stop offset="100%" stop-color="#24bd63"/>
    </linearGradient>
    <linearGradient id="minus" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffa08d"/>
      <stop offset="100%" stop-color="#f05268"/>
    </linearGradient>
    <linearGradient id="d-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <clipPath id="d-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#d-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#d-bg)"/>
  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 49C22 54 43 51 60 41V60H4Z" fill="#000000" opacity="0.20"/>

    <g filter="url(#cube-shadow)" stroke="#ffffff" stroke-opacity="0.30" stroke-width="0.8" stroke-linejoin="round">
      <path d="M32 12L50 22L32 32L14 22Z" fill="url(#cube-top)"/>
      <path d="M14 22L32 32V52L14 42Z" fill="url(#cube-left)"/>
      <path d="M50 22L32 32V52L50 42Z" fill="url(#cube-right)"/>
      <path d="M25.5 15.6L43.5 25.6L38 28.7L20 18.7Z" fill="#ffffff" fill-opacity="0.30" stroke="none"/>
      <path d="M27.4 34.3V43.9L21.6 40.7V31.1Z" fill="#ffffff" fill-opacity="0.84" stroke="none"/>
      <path d="M35.7 34L45 28.8V32.6L35.7 37.8Z" fill="#ffffff" fill-opacity="0.24" stroke="none"/>
    </g>

    <g filter="url(#badge-shadow)">
      <circle cx="48" cy="17.5" r="8.6" fill="url(#plus)"/>
      <circle cx="48" cy="17.5" r="7.85" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="0.8"/>
      <path d="M48 13.4V21.6M43.9 17.5H52.1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g filter="url(#badge-shadow)">
      <circle cx="16.5" cy="47" r="7.7" fill="url(#minus)"/>
      <circle cx="16.5" cy="47" r="6.95" fill="none" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
      <path d="M12.7 47H20.3" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
