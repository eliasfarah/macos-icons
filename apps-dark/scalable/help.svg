  <g filter="url(#d-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#d-bg)"/>
  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 46C22 52 43 49 60 39V60H4Z" fill="#000000" opacity="0.22"/>

    <g filter="url(#buoy-shadow)">
      <ellipse cx="32" cy="50.5" rx="16" ry="3.2" fill="#000000" opacity="0.36"/>
      <circle cx="32" cy="31.5" r="20.7" fill="none" stroke="#65451d" stroke-width="2.4" opacity="0.68"/>
      <circle cx="32" cy="31.5" r="20.7" fill="none" stroke="url(#rope)" stroke-width="1.55" stroke-dasharray="1.25 1.05"/>
      <circle cx="32" cy="31.5" r="18.3" fill="#590719" opacity="0.62"/>
      <g mask="url(#ring)">
        <circle cx="32" cy="31.5" r="17.4" fill="url(#red)"/>
        <g stroke="url(#white-band)" stroke-width="8.2" stroke-linecap="butt">
          <path d="M39 24.5L48.5 15"/>
          <path d="M39 38.5L48.5 48"/>
          <path d="M25 38.5L15.5 48"/>
          <path d="M25 24.5L15.5 15"/>
        </g>
        <ellipse cx="27" cy="22.5" rx="12" ry="8" fill="#ffffff" opacity="0.13" transform="rotate(-26 27 22.5)"/>
        <path d="M15.5 39C24 46 39 47 49 36" fill="none" stroke="#650719" stroke-opacity="0.34" stroke-width="3"/>
      </g>
      <circle cx="32" cy="31.5" r="8.55" fill="url(#hole)"/>
      <circle cx="32" cy="31.5" r="8.75" fill="none" stroke="#520617" stroke-opacity="0.76" stroke-width="1"/>
      <path d="M32 10.8V15M52.7 31.5H48.5M32 52.2V48M11.3 31.5H15.5" stroke="#8f6934" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M18.8 20A16.8 16.8 0 0 1 34 14.3" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
