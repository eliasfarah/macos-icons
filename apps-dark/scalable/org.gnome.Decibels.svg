<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="player-shadow" x="-38%" y="-38%" width="176%" height="185%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.66"/>
    </filter>
    <linearGradient id="d-bg" x1="10%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#19365b"/>
      <stop offset="48%" stop-color="#0e1e35"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="50%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#4d8cff" stop-opacity="0.17"/>
      <stop offset="58%" stop-color="#4d8cff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4d8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-sheen" cx="22%" cy="4%" r="82%" fx="22%" fy="4%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="35%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#29466f"/>
      <stop offset="58%" stop-color="#132541"/>
      <stop offset="100%" stop-color="#070e1e"/>
    </radialGradient>
    <linearGradient id="metal" gradientUnits="userSpaceOnUse" x1="32" y1="17" x2="32" y2="49">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="46%" stop-color="#d7e5f0"/>
      <stop offset="100%" stop-color="#71899f"/>
    </linearGradient>
    <linearGradient id="ear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf5fc"/>
      <stop offset="42%" stop-color="#8db4d1"/>
      <stop offset="100%" stop-color="#365a82"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#44e6ff"/>
      <stop offset="52%" stop-color="#7d78ff"/>
      <stop offset="100%" stop-color="#ff69b7"/>
    </linearGradient>
    <linearGradient id="d-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="34%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <clipPath id="d-clip">
      <rect x="4" y="4" width="56" height="56" rx="14"/>
    </clipPath>
  </defs>

  <g filter="url(#d-shadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#d-bg)"/>
  </g>
  <g clip-path="url(#d-clip)">
    <rect x="4" y="4" width="56" height="56" fill="url(#d-glow)"/>
    <rect x="4" y="4" width="56" height="56" fill="url(#d-sheen)"/>
    <path d="M4 47C22 53 43 50 60 39V60H4Z" fill="#000000" opacity="0.22"/>

    <g filter="url(#player-shadow)">
      <circle cx="32" cy="34" r="13.2" fill="url(#disc)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.9"/>
      <circle cx="32" cy="34" r="10.9" fill="none" stroke="#75a2c8" stroke-opacity="0.18" stroke-width="0.6"/>
      <path d="M16.2 35V31.5C16.2 21.5 22.7 16.5 32 16.5C41.3 16.5 47.8 21.5 47.8 31.5V35" fill="none" stroke="url(#metal)" stroke-width="5" stroke-linecap="round"/>
      <rect x="11.8" y="32.5" width="9.3" height="15.5" rx="4.3" fill="url(#ear)"/>
      <rect x="42.9" y="32.5" width="9.3" height="15.5" rx="4.3" fill="url(#ear)"/>
      <path d="M15.2 35.8V44.6M48.8 35.8V44.6" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.34"/>
      <g fill="url(#wave)">
        <rect x="24.3" y="31" width="2.5" height="6" rx="1.25"/>
        <rect x="28.2" y="27.5" width="2.5" height="13" rx="1.25"/>
        <rect x="32.1" y="29.5" width="2.5" height="9" rx="1.25"/>
        <rect x="36" y="25.5" width="2.5" height="17" rx="1.25"/>
        <rect x="39.9" y="31.5" width="2.5" height="5" rx="1.25"/>
      </g>
      <path d="M23.5 45H40.5" stroke="#7ca5c5" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="34.5" cy="45" r="1.35" fill="#ff75b8"/>
    </g>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
</svg>
