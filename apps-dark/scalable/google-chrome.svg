      <stop offset="55%" stop-color="#4285f4" stop-opacity="0.0350" />
      <stop offset="100%" stop-color="#4285f4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="c-red" x1="10%" y1="100%" x2="80%" y2="0%">
