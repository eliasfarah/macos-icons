    <g>
      <path d="M 32 32 L 15 32 A 17 17 0 0 1 40.5 17.28 Z" fill="url(#c-red)" />
      <path d="M 32 32 L 40.5 17.28 A 17 17 0 0 1 40.5 46.72 Z" fill="url(#c-yellow)" />
