<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Elegant Apple-style Drop Shadow -->
    <filter id="glass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <!-- 3D Bevel/Glass Highlights -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    
    <!-- Premium Dark Background Gradient for Gemini -->
    <linearGradient id="bg-grad-gemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f24" />
      <stop offset="100%" stop-color="#0f1013" />
    </linearGradient>
    
    <!-- Official Google Gemini Star Gradient -->
    <linearGradient id="gemini-star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="35%" stop-color="#8ab4f8" />
      <stop offset="70%" stop-color="#c58af9" />
      <stop offset="100%" stop-color="#e8eaed" />
    </linearGradient>

    <!-- Unified Squircle Mask -->
    <clipPath id="squircle-clip">
      <rect width="56" height="56" x="4" y="4" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Background with Shadow -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="url(#bg-grad-gemini)" filter="url(#glass-shadow)" />
  
  <!-- Centered Google Gemini Sparkle Star -->
  <g transform="translate(12, 12)">
    <path fill="url(#gemini-star-grad)" d="M20 0C20 11.0457 11.0457 20 0 20C11.0457 20 20 28.9543 20 40C20 28.9543 28.9543 20 40 20C28.9543 20 20 11.0457 20 0Z" />
  </g>
  
  <!-- Glass Bevel Overlay -->
  <rect width="56" height="56" x="4" y="4" rx="14" ry="14" fill="none" stroke="url(#inner-bevel)" stroke-width="1.5" />
</svg>