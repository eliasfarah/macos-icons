      <stop offset="55%" stop-color="#1687ff" stop-opacity="0.0700" />
      <stop offset="100%" stop-color="#1687ff" stop-opacity="0" />
    </radialGradient>
    <filter id="store-glyph-shadow" x="-30%" y="-25%" width="160%" height="165%">
