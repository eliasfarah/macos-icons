    <rect x="19.5" y="43.8" width="20" height="3.2" rx="1.6" fill="#000000" opacity="0.42"/>
    <circle cx="24.8" cy="45.4" r="0.9" fill="#d7e8fa"/>
    <circle cx="29.5" cy="45.4" r="0.9" fill="#d7e8fa"/>
