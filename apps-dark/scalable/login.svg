      <circle cx="47.5" cy="46.5" r="9.25" fill="none" stroke="#ffffff" stroke-opacity="0.46" stroke-width="0.8"/>
    </g>
    <g fill="none" stroke="#173860" stroke-width="2.25" stroke-linecap="round">
      <circle cx="47.5" cy="46.5" r="4.4"/>
      <path d="M47.5 37.8V40M47.5 53V55.2M38.8 46.5H41M54 46.5H56.2M41.35 40.35L42.9 41.9M52.1 51.1L53.65 52.65M41.35 52.65L42.9 51.1M52.1 41.9L53.65 40.35"/>
    </g>
    <circle cx="47.5" cy="46.5" r="1.75" fill="#173860"/>
  </g>

  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="13.75" fill="none" stroke="#000000" stroke-opacity="0.34" stroke-width="0.5"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="13.25" fill="none" stroke="url(#d-rim)" stroke-width="0.75"/>
