<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="d-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.8" flood-color="#000000" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="panel-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.7" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="badge-shadow" x="-45%" y="-45%" width="190%" height="195%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#000000" flood-opacity="0.66"/>
    </filter>
    <linearGradient id="d-bg" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#1b3e70"/>
      <stop offset="48%" stop-color="#102747"/>
      <stop offset="100%" stop-color="#080d19"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="30%" cy="10%" r="82%">
      <stop offset="0%" stop-color="#55b8ff" stop-opacity="0.22"/>
      <stop offset="58%" stop-color="#297ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#297ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="d-sheen" cx="22%" cy="4%" r="82%" fx="22%" fy="4%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.105"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.022"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
